[build]
builder = "DOCKERFILE"
dockerfilePath = "./Dockerfile"

[deploy]
startCommand = "./whatsmeow-api"
healthcheckPath = "/health"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
# Volumen en /app/data: Railway no corre dos réplicas a la vez.
# overlap 0 + draining: SIGTERM → Disconnect (no Logout) y flush de sqlite
# antes del SIGKILL. Las sesiones se reconectan solas al arrancar.
overlapSeconds = 0
drainingSeconds = 25

[deploy.env]
SKIP_GROUPS = "true"
MAX_MSG_HISTORY = "100"
MAX_RAW_MEDIA_CACHE = "120"
VERBOSE_LOGS = "false"
CLIENT_LOG_LEVEL = "ERROR"
SQLITE_BUSY_TIMEOUT_MS = "15000"
AUTO_CONNECT_STAGGER_SEC = "5"
AUTO_CONNECT_DELAY_SEC = "12"
RECONNECT_WATCH_SEC = "15"
SESSION_STATUS_DEBOUNCE_SEC = "30"
SHUTDOWN_WAIT_SEC = "8"
GOGC = "80"

[[mounts]]
mountPath = "/app/data"
